[package]
name = "gtnh-recipes-db"
version = "0.1.0"
edition = "2021"
description = "把 ExportRecipe 导出的 JSON 配方数据导入 SQLite，提供可查询的配方数据库"

[dependencies]
# JSON 解析
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite：bundled 表示把 SQLite 源码一起编译进二进制，产物自包含、不依赖系统库
rusqlite = { version = "0.32", features = ["bundled"] }
# 错误处理
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
